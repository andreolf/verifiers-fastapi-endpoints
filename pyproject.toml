[project]
name = "fastapi-endpoints"
version = "0.7.0"
description = "Eval of a model's ability to write correct FastAPI code, scored by a static floor plus execution-based TestClient behavior rewards."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.0",
    "datasets>=2.14.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# flat single-module environment
include = ["fastapi_endpoints.py"]

[tool.prime.environment]
# metadata the Hub reads; entrypoint is the module's load_environment()
entrypoint = "fastapi_endpoints:load_environment"
tags = ["code", "fastapi", "python", "single-turn", "execution-based"]
